<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rust Amigos — игры</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<style>
:root{
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#16181a;--panel:#23272a;--line:#3a4044;--text:#e9e4d8;--muted:#9aa3a8;--rust:#c2511f;--rustHi:#e8743a;
  --face:#e6dbbf;--edge:#a89a74;color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:"Trebuchet MS",Verdana,sans-serif;user-select:none;-webkit-user-select:none}
h1{margin:0;font:700 2.2rem Impact,"Arial Narrow",sans-serif;letter-spacing:.04em;color:var(--rustHi);text-align:center}
button{font:inherit;background:var(--rust);color:#fff;border:0;border-radius:8px;padding:8px 14px;cursor:pointer}
button.alt{background:var(--panel);border:1px solid var(--line);color:var(--text)}
button:focus-visible,a:focus-visible{outline:3px solid var(--text);outline-offset:2px}
a.btn{display:inline-block;background:#1b2838;color:#fff;text-decoration:none;border-radius:8px;padding:8px 14px;border:1px solid #3d5a7a}
.top{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:flex-end;padding:10px 12px}
.user{display:flex;align-items:center;gap:8px;font-size:.9rem}
.user img{width:28px;height:28px;border-radius:50%;border:2px solid var(--rust)}
.wrap{max-width:680px;margin:0 auto;padding:6px 16px 28px;display:flex;flex-direction:column;align-items:center;gap:14px}
.sub{margin:0;color:var(--muted);text-align:center}
.gl{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;width:100%;margin-top:6px}
.gc{display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-top:5px solid var(--rust);
  border-radius:12px;padding:24px 14px;color:var(--text);text-decoration:none;text-align:center;transition:transform .15s,border-color .15s}
.gc:hover{border-color:var(--rustHi);transform:translateY(-3px)}
.gc .ge{font-size:3rem;line-height:1}
.gc b{font:700 1.4rem Impact,"Arial Narrow",sans-serif;letter-spacing:.03em}
.gc small{color:var(--muted);line-height:1.4}
.note{margin:4px 0 0;color:var(--muted);font-size:.85rem;text-align:center;line-height:1.5}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:1000;padding:16px}
.ov.show{display:flex}
.box{background:var(--panel);border:1px solid var(--line);border-top:5px solid var(--rust);border-radius:12px;padding:22px;max-width:460px;width:100%;text-align:center}
.box h2{margin:0 0 8px;font:700 1.5rem Impact,"Arial Narrow",sans-serif;letter-spacing:.03em}
.box p{margin:0 0 12px;color:var(--muted);line-height:1.4}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.lbwrap{max-height:50vh;overflow:auto;margin-bottom:12px}
.lb{width:100%;border-collapse:collapse;text-align:left}
.lb td,.lb th{padding:7px 6px;border-bottom:1px solid var(--line);font-size:.95rem}
.lb th{color:var(--muted);font-weight:400}
.lb tr.me td{color:var(--rustHi);font-weight:700}
.lb .av{width:22px;height:22px;border-radius:50%;vertical-align:middle;margin-right:8px}
.lb a{color:inherit;text-decoration:none}
@media (max-width:700px){h1{font-size:1.8rem}.top{justify-content:center}}
</style>
</head>
<body>
<div class="top">
  <button class="alt" id="lb">🏆 Рейтинг</button>
  <span id="auth" class="user"></span>
</div>

<div class="wrap">
  <h1>RUST AMIGOS</h1>
  <p class="sub">Выберите игру</p>
  <div class="gl">
    <a class="gc" href="mahjong.html"><span class="ge">🀄</span><b>МАДЖОНГ</b><small>5 уровней, промокоды для магазина, рейтинг по прохождениям и скорости</small></a>
    <a class="gc" href="tanki.html"><span class="ge">🪖</span><b>ТАНЧИКИ</b><small>Волны врагов, боссы, гараж и скины, рейтинг по волнам и очкам</small></a>
  </div>
  <p class="note">Вход через Steam один на все игры: после входа ваши результаты попадают в общий рейтинг.</p>
</div>

<div class="ov" id="lbov"><div class="box">
  <h2>Рейтинг</h2>
  <div class="row" id="tabs" style="margin-bottom:10px"></div>
  <p id="lbdesc"></p>
  <div class="lbwrap"><table class="lb"><thead><tr><th>#</th><th>Игрок</th><th id="lbh"></th></tr></thead><tbody id="lbb"></tbody></table></div>
  <p id="lbmsg"></p>
  <button id="lbclose">Закрыть</button>
</div></div>

<script>
// Адрес вашего сервера (Cloudflare Worker)
var API='https://rust-mahjong-api.rust-pve.workers.dev';
var $=function(i){return document.getElementById(i)};

// ====== Вход через Steam (токен общий для всех игр, хранится в localStorage) ======
var tok=null,me=null;
function b64d(s){s=s.replace(/-/g,'+').replace(/_/g,'/');var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return new TextDecoder().decode(u)}
function setTok(t){
  try{var p=JSON.parse(b64d(t.split('.')[0]));if(p.k!=='s'||p.exp<Date.now())throw 0;tok=t;me=p}
  catch(e){tok=null;me=null;try{localStorage.removeItem('rm-token')}catch(x){}}
}
function loadSession(){
  var m=location.hash.match(/[#&]t=([^&]+)/);
  if(m){setTok(m[1]);if(tok){try{localStorage.setItem('rm-token',tok)}catch(e){}}history.replaceState(null,'',location.pathname+location.search)}
  else{try{var t=localStorage.getItem('rm-token');if(t)setTok(t)}catch(e){}}
}
function api(path,body){
  var o={method:body?'POST':'GET',headers:{}};
  if(tok)o.headers.Authorization='Bearer '+tok;
  if(body){o.headers['Content-Type']='application/json';o.body=JSON.stringify(body)}
  return fetch(API+path,o).then(function(r){
    if(r.status===401)logout();
    return r.json().then(function(j){if(!r.ok)throw j;return j});
  });
}
function logout(){tok=null;me=null;try{localStorage.removeItem('rm-token')}catch(e){}renderAuth()}
function renderAuth(){
  var a=$('auth');a.innerHTML='';
  if(me){
    if(me.a&&me.a.indexOf('https://')===0){var im=document.createElement('img');im.src=me.a;im.alt='';a.appendChild(im)}
    var n=document.createElement('span');n.textContent=me.n;a.appendChild(n);
    var b=document.createElement('button');b.className='alt';b.textContent='Выйти';b.onclick=logout;a.appendChild(b);
  }else{
    var l=document.createElement('a');l.className='btn';l.textContent='Войти через Steam';l.href=API+'/auth/steam';
    l.onclick=function(){try{sessionStorage.setItem('rm-back','index.html')}catch(e){}};a.appendChild(l);
  }
}

// ====== Рейтинг: все таблицы в одном окне ======
function fmtMs(ms){var s=Math.round(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60),r=s%60;return (h?h+':'+('0'+m).slice(-2):m)+':'+('0'+r).slice(-2)}
var MODES=[
  {id:'mj', tab:'Маджонг: прохождения',url:'/api/leaderboard',   h:'Прошёл', d:'Сколько раз игрок прошёл маджонг целиком',               v:function(p){return p.c}},
  {id:'mjs',tab:'Маджонг: скорость',   url:'/api/speed',         h:'Время',  d:'Лучшее время прохождения всех уровней маджонга подряд',  v:function(p){return fmtMs(p.ms)}},
  {id:'tkw',tab:'Танчики: волны',      url:'/api/tanks?by=wave', h:'Волн',   d:'Сколько волн пройдено за один забег (рядом очки)',       v:function(p){return p.w+' · '+p.s+' оч.'}},
  {id:'tks',tab:'Танчики: очки',       url:'/api/tanks?by=score',h:'Очков',  d:'Больше всего очков за один забег (рядом волны)',         v:function(p){return p.s+' · '+p.w+' волн'}}
];
var lbMode='mj';
function loadLb(id){
  lbMode=id;
  var M=MODES.filter(function(x){return x.id===id})[0],body=$('lbb'),msg=$('lbmsg');
  body.innerHTML='';msg.textContent='Загрузка…';$('lbh').textContent=M.h;$('lbdesc').textContent=M.d;
  Array.prototype.forEach.call($('tabs').children,function(b){b.className=b.getAttribute('data-id')===id?'':'alt'});
  api(M.url).then(function(j){
    if(lbMode!==id)return;
    msg.textContent=j.players.length?'':'Пока нет результатов.';
    j.players.forEach(function(p,i){
      var tr=document.createElement('tr');if(me&&p.id===me.sid)tr.className='me';
      var c1=document.createElement('td');c1.textContent=i+1;
      var c2=document.createElement('td');
      if(p.a&&p.a.indexOf('https://')===0){var im=document.createElement('img');im.className='av';im.src=p.a;im.alt='';c2.appendChild(im)}
      var a=document.createElement('a');a.textContent=p.n;a.href='https://steamcommunity.com/profiles/'+p.id;a.target='_blank';a.rel='noopener';c2.appendChild(a);
      var c3=document.createElement('td');c3.textContent=M.v(p);
      tr.appendChild(c1);tr.appendChild(c2);tr.appendChild(c3);body.appendChild(tr);
    });
  }).catch(function(){if(lbMode===id)msg.textContent='Не удалось загрузить рейтинг. Проверьте адрес сервера в начале скрипта.'});
}
MODES.forEach(function(M){
  var b=document.createElement('button');b.textContent=M.tab;b.setAttribute('data-id',M.id);b.style.fontSize='.85rem';b.style.padding='6px 10px';
  b.onclick=function(){loadLb(M.id)};$('tabs').appendChild(b);
});
$('lb').onclick=function(){$('lbov').classList.add('show');loadLb(lbMode)};
$('lbclose').onclick=function(){$('lbov').classList.remove('show')};

loadSession();renderAuth();
// После входа возвращаем игрока на ту страницу, откуда он нажал «Войти через Steam»
try{
  var back=sessionStorage.getItem('rm-back');
  if(back){sessionStorage.removeItem('rm-back');if(tok&&/^[a-z]+\.html$/.test(back)&&back!=='index.html')location.replace(back)}
}catch(e){}
</script>
</body>
</html>
