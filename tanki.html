<script>
const $=s=>document.querySelector(s),cv=$('#c'),x=cv.getContext('2d'),gr=document.createElement('canvas'),g=gr.getContext('2d');
const R=(a,b)=>b===undefined?Math.random()*a:a+Math.random()*(b-a),C=(v,a,b)=>Math.max(a,Math.min(b,v)),PI=Math.PI;
const ad=(a,b)=>{let d=b-a;while(d>PI)d-=2*PI;while(d<-PI)d+=2*PI;return d},la=(a,b,k)=>a+ad(a,b)*Math.min(1,k);
let al=[],mn=[],pk,up,pause=0,rpN=0,paused=0,W,H,S,GW,GH,OK,cam={x:0,y:0},p,en,bl,pt,rg,ob,queue,score,wave,spawnT,waitT,over,started,shake=0,slow=0,hurt=0,last=0;
const keys={},st={L:null,R:null},ms={x:0,y:0,on:0,down:0};
const TY={n:{hp:3,sp:3.2,cd:1.6,c:'#c2453a',r:.55,pts:100},s:{hp:2,sp:5.2,cd:1.2,c:'#d9a32e',r:.45,pts:150},h:{hp:8,sp:2.1,cd:2.3,c:'#7b4fc2',r:.75,pts:300},B:{hp:55,sp:1.6,cd:1.0,c:'#8c1f1f',r:1.15,pts:1000},Q:{hp:4,sp:2.6,cd:2.4,c:'#2f8fbf',r:.6,pts:200},M:{hp:3,sp:2.8,cd:3.2,c:'#6b6f2a',r:.55,pts:200}};
const BN=['Штурмовик','Каратель','Командир'],SC={x:25,s:20,d:15},WA={pel:1,spr:.06,v:1,life:1.3,d:.7},TR=[{k:'ar',n:'Броня',i:'🛡'},{k:'fi',n:'Урон',i:'🔥'},{k:'nc',n:'Некромант',i:'☠'}],WP={std:{n:'Пушка',i:'🔫',c:1,d:1,pel:1,spr:.03,v:1,life:1.3,p:0},sn:{n:'Снайпер',i:'🎯',c:2.2,d:3.5,pel:1,spr:.008,v:1.5,life:1.7,p:150},sh:{n:'Дробовик',i:'💥',c:1.6,d:.7,pel:5,spr:.2,v:.85,life:.45,p:250},rp:{n:'Скорострел',i:'⚙',c:.45,d:.5,pel:1,spr:.09,v:1.1,life:1.1,p:350}};
const SK={g:{n:'Зелёный',c:'#4f9d62',f:'255,170,70',p:0},d:{n:'Пустыня',c:'#c9a45a',f:'255,200,90',p:50},n:{n:'Неон',c:'#2fd0d9',f:'60,220,255',p:120},b:{n:'Пламя',c:'#e0562a',f:'255,70,30',p:200},v:{n:'Плазма',c:'#b45cf0',f:'200,100,255',p:300}};
/* прогрессия: макс. уровень, опыт на уровень, цены рангов (очки навыков), очки за уровень, цены апгрейда оружия (монеты) */
const MAXLV=100,XN=l=>100+30*l,RC=[1,3,9,27,125],PPL=5,WU=[60,300];
let sv={co:0,own:['g'],sel:'g',lv:1,xp:0,tr:{ar:0,fi:0,nc:0},wp:'std',wl:{std:0}};try{Object.assign(sv,JSON.parse(localStorage.getItem('tk')||'{}'))}catch(e){}
sv.lv=Math.min(sv.lv,MAXLV);
const svs=()=>{try{localStorage.setItem('tk',JSON.stringify(sv))}catch(e){}};

/* ===== вход через Steam (общий с меню и маджонгом) и рейтинг волн ===== */
const API='https://rust-mahjong-api.rust-pve.workers.dev';
let tok=null,me=null,runTok=null;
function b64d(s){s=s.replace(/-/g,'+').replace(/_/g,'/');const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return new TextDecoder().decode(u)}
try{const t=localStorage.getItem('rm-token');if(t){const q=JSON.parse(b64d(t.split('.')[0]));if(q.k==='s'&&q.exp>Date.now()){tok=t;me=q}else localStorage.removeItem('rm-token')}}catch(e){}
function api(path,body){const o={method:body?'POST':'GET',headers:{}};if(tok)o.headers.Authorization='Bearer '+tok;if(body){o.headers['Content-Type']='application/json';o.body=JSON.stringify(body)}
 return fetch(API+path,o).then(r=>{if(r.status===401)logout();return r.json().then(j=>{if(!r.ok)throw j;return j})})}
function logout(){tok=me=runTok=null;try{localStorage.removeItem('rm-token')}catch(e){}renderAuth()}
function renderAuth(){const a=$('#au');a.innerHTML='';
 if(me){if(me.a&&me.a.indexOf('https://')===0){const im=document.createElement('img');im.src=me.a;im.alt='';a.appendChild(im)}
  const n=document.createElement('span');n.textContent=me.n+' · рекорды идут в рейтинг';a.appendChild(n);
  const o=document.createElement('a');o.href='#';o.className='sm';o.textContent='Выйти';o.onclick=e=>{e.preventDefault();logout()};a.appendChild(o)}
 else{const l=document.createElement('a');l.className='lk';l.textContent='Войти через Steam для рейтинга';l.href=API+'/auth/steam';l.onclick=()=>{try{sessionStorage.setItem('rm-back','tanki.html')}catch(e){}};a.appendChild(l)}}
function startRun(){runTok=null;if(!tok)return;api('/api/start',{game:'tk'}).then(j=>{runTok=j.run}).catch(()=>{})}
function report(w,sc){if(tok&&runTok)api('/api/tank',{run:runTok,wave:w,score:sc}).catch(()=>{})}

function resize(){const d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;S=Math.min(W,H)/14;GW=Math.round(Math.max(S*52,W*1.6));GH=Math.round(Math.max(S*28,H*1.6));OK=GW*GH/(S*S*392);cv.width=W*d;cv.height=H*d;x.setTransform(d,0,0,d,0,0);const gs=Math.min(1,Math.sqrt(6e6/(GW*GH)));gr.width=Math.round(GW*gs);gr.height=Math.round(GH*gs);g.setTransform(gs,0,0,gs,0,0);paintGround()}
function paintGround(){g.fillStyle='#2b3328';g.fillRect(0,0,GW,GH);const n=Math.round(GW*GH/640);for(let i=0;i<n;i++){g.fillStyle=Math.random()<.5?'rgba(255,255,255,.035)':'rgba(0,0,0,.07)';g.fillRect(R(GW),R(GH),R(2,S*.7),R(2,S*.7))}}

/* audio */
let ac,nb;
function A(){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)()}catch(e){}return ac}
function sfx(k){const c=A();if(!c)return;const t=c.currentTime,v=c.createGain();v.connect(c.destination);
 if(k===2){if(!nb){nb=c.createBuffer(1,c.sampleRate*.6,c.sampleRate);const d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length)}
  const s=c.createBufferSource(),f=c.createBiquadFilter();s.buffer=nb;f.type='lowpass';f.frequency.setValueAtTime(900,t);f.frequency.exponentialRampToValueAtTime(80,t+.5);s.connect(f);f.connect(v);v.gain.setValueAtTime(.45,t);v.gain.exponentialRampToValueAtTime(.001,t+.55);s.start(t)}
 else{const o=c.createOscillator();o.type=k===3?'triangle':k?'square':'sawtooth';o.frequency.setValueAtTime([320,200,0,520][k],t);o.frequency.exponentialRampToValueAtTime(60,t+.12);o.connect(v);v.gain.setValueAtTime(k===3?.04:.06,t);v.gain.exponentialRampToValueAtTime(.001,t+.13);o.start(t);o.stop(t+.14)}}
const vib=n=>{try{navigator.vibrate&&navigator.vibrate(n)}catch(e){}};

/* particles */
function P(px,py,a,sp,l,s,t,c){pt.push({x:px,y:py,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,l,m:l,s,t,c})}
function muzzle(px,py,a,own){for(let i=0;i<7;i++)P(px,py,a+R(-.35,.35),R(6,18)*S,R(.1,.25),R(1,2.2),'k');for(let i=0;i<3;i++)P(px,py,a+R(-.6,.6),R(1,4)*S,R(.4,.8),S*.35,'s');P(px,py,0,0,.08,S*(own?2:1.3),'g','255,200,100');if(own)shake=Math.max(shake,2.2)}
function spark(px,py){for(let i=0;i<6;i++)P(px,py,R(7),R(3,10)*S,R(.15,.4),R(1,2),'k');P(px,py,0,0,.1,S*.9,'g','255,190,90')}
function crate(o){const cx=o.x+o.w/2,cy=o.y+o.h/2;for(let i=0;i<10;i++)P(cx,cy,R(7),R(2,8)*S,R(.6,1.2),R(2,5),'d','#8a6a3a');for(let i=0;i<4;i++)P(cx,cy,R(7),R(.5,2)*S,R(.6,1.1),S*.5,'s');spark(cx,cy);shake=Math.max(shake,2);sfx(3)}
function boom(px,py,k){
 for(let i=0;i<18*k;i++)P(px,py,R(7),R(.5,6)*S*k,R(.4,.9),S*R(.35,.75)*k,'f');
 for(let i=0;i<24;i++)P(px,py,R(7),R(4,14)*S,R(.3,.8),R(1.2,2.2),'k');
 for(let i=0;i<12;i++)P(px,py,R(7),R(.3,2)*S,R(1,2),S*.7,'s');
 for(let i=0;i<10;i++)P(px,py,R(7),R(2,8)*S,R(.8,1.4),R(2,5),'d',i%2?'#3a3a36':'#6a2a22');
 P(px,py,0,0,.3,S*5*k,'g',SK[sv.sel].f);rg.push({x:px,y:py,r:S*.5,l:.45,m:.45,k});
 const q=g.createRadialGradient(px,py,0,px,py,S*1.4*k);q.addColorStop(0,'rgba(0,0,0,.6)');q.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=q;g.fillRect(px-S*2*k,py-S*2*k,S*4*k,S*4*k);
 shake=Math.max(shake,8*k);slow=.15;sfx(2);vib(k>1?[30,20,60]:35)}

/* world */
const camUpd=()=>{cam.x=p.x-W/2;cam.y=p.y-H/2};
const inV=(e,m)=>Math.abs(e.x-p.x)<W/2+m&&Math.abs(e.y-p.y)<H/2+m;
function spawnPos(r){const mg=S*1.5;
 for(let i=0;i<14;i++){const a=R(2*PI),c=Math.cos(a),sn=Math.sin(a),t=Math.min((W/2+mg)/(Math.abs(c)||1e-6),(H/2+mg)/(Math.abs(sn)||1e-6)),px=C(p.x+c*t,r,GW-r),py=C(p.y+sn*t,r,GH-r);
  if(Math.abs(px-p.x)>W/2+S*.3||Math.abs(py-p.y)>H/2+S*.3)return[px,py]}
 return[p.x<GW/2?GW-r:r,p.y<GH/2?GH-r:r]}
function mk(t){const d=TY[t],r=d.r*S,s=R(4)|0;const[px,py]=spawnPos(r);
 const H_=Math.ceil(d.hp*(1+.012*(sv.lv-1)+Math.min(.5,.025*wave))),bv=((wave/5|0)-1)%3;return{type:t,hp:H_,mh:H_,bv,sp:d.sp,c:t=='B'?['#8c1f1f','#a0501a','#1f5a8c'][bv]:d.c,r:d.r,pts:d.pts,cdMax:d.cd,x:px,y:py,a:PI/2,t:PI/2,cd:R(1,2),ph:R(6),w:0,rc:0,fl:0,tr:0}}
function reset(){startRun();up={sp:0,hp:0,rt:0};p={x:GW/2,y:GH/2,a:-PI/2,t:-PI/2,r:.55,sp:5,hp:100,mhp:100,rate:.22,dbl:0,sh:0,cd:0,rc:0,fl:0,tr:0,c:SK[sv.sel].c};pk=[];pause=0;rpN=0;setPause(0);$('#up').classList.add('h');applyUp();p.hp=p.mhp;p.dm=1+.1*sv.tr.fi;al=[];mn=[];en=[];bl=[];pt=[];rg=[];queue=[];score=0;wave=0;over=false;waitT=-1;spawnT=0;hurt=0;paintGround();ob=[];
 const NO=Math.round(14*OK),NS=Math.round(4*OK);for(let i=0;i<NO;i++){const st_=i<NS,w=st_?S*2:S*1.1,h=st_?S*1.2:S*1.1;let px,py,n=0;
  do{px=R(S,GW-S-w);py=R(S,GH-S-h)}while(n++<40&&(Math.hypot(px+w/2-GW/2,py+h/2-GH/2)<S*3.5||ob.some(o=>!(px>o.x+o.w+S||px+w<o.x-S||py>o.y+o.h+S||py+h<o.y-S))));
  ob.push({x:px,y:py,w,h,hp:st_?1e9:3,steel:st_})}
 startWave()}
function startWave(){wave++;if(wave>1)buildMap((wave-1)%3);const n=3+wave*2;for(let i=0;i<n;i++)queue.push(pickT());if(wave%5==0){queue.length=Math.min(queue.length,6);queue.push('B')}spawnT=.5;$('#wv').textContent=wave;banner(wave%5==0?'⚠ БОСС «'+BN[((wave/5|0)-1)%3]+'»':'Волна '+wave)}
function banner(t){const b=$('#ban');b.textContent=t;b.classList.add('s');setTimeout(()=>b.classList.remove('s'),1200)}
function push(e,o,r){const cx=C(e.x,o.x,o.x+o.w),cy=C(e.y,o.y,o.y+o.h),dx=e.x-cx,dy=e.y-cy,d=Math.hypot(dx,dy);if(d<r){if(d>.001){e.x+=dx/d*(r-d);e.y+=dy/d*(r-d)}else e.x+=r}}
function moveT(e,dx,dy,dt){const r=e.r*S,px=e.x,py=e.y;e.x=C(e.x+dx*e.sp*S*dt,r,GW-r);e.y=C(e.y+dy*e.sp*S*dt,r,GH-r);for(const o of ob)push(e,o,r);
 e.tr+=Math.hypot(e.x-px,e.y-py);if(e.tr>S*.5){e.tr=0;g.save();g.translate(e.x,e.y);g.rotate(e.a);g.fillStyle='rgba(12,15,9,.22)';g.fillRect(-r*.3,-r*.8,r*.35,r*.4);g.fillRect(-r*.3,r*.4,r*.35,r*.4);g.restore()}}
